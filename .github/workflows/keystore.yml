# Разовая задача: создать постоянный ключ подписи приложения.
# Запускается вручную (вкладка Actions → Create signing key → Run workflow).
# Ключ не попадает в репозиторий: он выкладывается артефактом, который нужно скачать,
# добавить в секреты репозитория и удалить артефакт.
name: Create signing key

on:
  workflow_dispatch:
    inputs:
      password:
        description: "Пароль для ключа (придумайте свой, минимум 6 символов)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        env:
          PASSWORD: ${{ inputs.password }}
        run: |
          keytool -genkeypair -v -keystore lingvo.jks -storetype PKCS12 -keyalg RSA -keysize 2048 \
            -validity 10000 -alias lingvo -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Lingvo World, OU=Personal, O=Lingvo World, C=RU"
          base64 -w0 lingvo.jks > lingvo.jks.base64
          echo "----- Отпечаток SHA-1 (добавьте его в Firebase) -----"
          keytool -list -v -keystore lingvo.jks -storepass "$PASSWORD" | grep -E "SHA1:|SHA256:"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            lingvo.jks
            lingvo.jks.base64
          retention-days: 1
