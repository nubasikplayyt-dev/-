# Публикация APK в GitHub Releases по тегу investwatch-v*.
# Обычные сборки на каждый push живут в invest-watch-android.yml.
name: InvestWatch Release

on:
  push:
    tags:
      - 'investwatch-v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: invest-watch-android

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Секреты нельзя читать прямо в if: — кладём их в env задачи.
      KEYSTORE_BASE64: ${{ secrets.INVESTWATCH_KEYSTORE_BASE64 }}
      INVESTWATCH_KEYSTORE_PASSWORD: ${{ secrets.INVESTWATCH_KEYSTORE_PASSWORD }}
      INVESTWATCH_KEY_ALIAS: ${{ secrets.INVESTWATCH_KEY_ALIAS }}
      INVESTWATCH_KEY_PASSWORD: ${{ secrets.INVESTWATCH_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Ключ подписи
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/investwatch.jks"
          echo "INVESTWATCH_KEYSTORE_FILE=$RUNNER_TEMP/investwatch.jks" >> "$GITHUB_ENV"

      - name: Тесты ядра
        run: ./gradlew --no-daemon -PcoreOnly=true :core:test

      - name: Сборка release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Переименовать APK понятно
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/invest-watch.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: invest-watch-android/artifact/invest-watch.apk
          name: InvestWatch ${{ github.ref_name }}
          body: |
            APK приложения «Портфель по критериям».
            Скачайте invest-watch.apk и откройте на телефоне.
