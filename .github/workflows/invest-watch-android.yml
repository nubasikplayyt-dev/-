# Сборка APK приложения invest-watch.
# Запускается только на изменения в invest-watch-android/ — сборки Lingvo World
# и portfolio-android живут в своих workflow и этого не касаются.
name: InvestWatch APK

on:
  push:
    paths:
      - 'invest-watch-android/**'
      - '.github/workflows/invest-watch-android.yml'
    tags:
      - 'investwatch-v*'
  pull_request:
    paths:
      - 'invest-watch-android/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: invest-watch-android

env:
  # В именах тестов есть кириллица, а Kotlin пишет её в имена файлов классов.
  # Без UTF-8 локали компиляция падает на InvalidPathException.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

permissions:
  contents: write

jobs:
  core:
    name: Тесты ядра
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Ядро не зависит от Android SDK — проверяем его отдельно и быстро.
      - name: Тесты
        run: ./gradlew --no-daemon -PcoreOnly=true :core:test

      - name: Отчёты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-reports
          path: invest-watch-android/core/build/reports/
          if-no-files-found: ignore

  apk:
    name: APK
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Ключ подписи приходит из секретов. Без них APK подписывается отладочным
      # ключом: на свой телефон ставится, в Google Play не публикуется.
      - name: Ключ подписи
        if: ${{ secrets.INVESTWATCH_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.INVESTWATCH_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/investwatch.jks"
          echo "INVESTWATCH_KEYSTORE_FILE=$RUNNER_TEMP/investwatch.jks" >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Сборка release APK
        env:
          INVESTWATCH_KEYSTORE_PASSWORD: ${{ secrets.INVESTWATCH_KEYSTORE_PASSWORD }}
          INVESTWATCH_KEY_ALIAS: ${{ secrets.INVESTWATCH_KEY_ALIAS }}
          INVESTWATCH_KEY_PASSWORD: ${{ secrets.INVESTWATCH_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Переименовать APK понятно
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/release/app-release.apk artifact/invest-watch.apk

      - name: Выложить APK артефактом
        uses: actions/upload-artifact@v4
        with:
          name: invest-watch-apk
          path: invest-watch-android/artifact/invest-watch.apk
          if-no-files-found: error

      # По тегу investwatch-v* APK попадает в GitHub Releases — оттуда его
      # удобно скачивать прямо с телефона.
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/investwatch-v')
        uses: softprops/action-gh-release@v2
        with:
          files: invest-watch-android/artifact/invest-watch.apk
          name: InvestWatch ${{ github.ref_name }}
          body: |
            APK приложения «Портфель по критериям».
            Скачайте invest-watch.apk и откройте на телефоне.

      - name: Отчёты при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-reports
          path: invest-watch-android/app/build/reports/
          if-no-files-found: ignore
